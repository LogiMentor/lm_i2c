name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-ubuntu:
    name: Repository hygiene (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Bash content hygiene
        shell: bash
        run: bash tools/check_repo_hygiene.sh --full

      - name: Run Bash tracked-path hygiene
        shell: bash
        run: bash tools/check_repo_hygiene.sh --tracked-paths

      - name: Run Bash history hygiene
        shell: bash
        run: bash tools/check_repo_hygiene.sh --history --revision-range HEAD

      - name: Test Bash commit-message policy
        shell: bash
        run: |
          clean_message=$(mktemp "$RUNNER_TEMP/lm_i2c-clean.XXXXXX")
          blocked_message=$(mktemp "$RUNNER_TEMP/lm_i2c-blocked.XXXXXX")
          cleanup() {
            rm -f -- "$clean_message" "$blocked_message"
          }
          trap cleanup EXIT

          printf '%s\n' "ci: validate repository hygiene" >"$clean_message"
          bash tools/check_repo_hygiene.sh \
            --commit-message-file "$clean_message"

          printf '%s\n' \
            'Co-authored-by: Somebody x@y.z hygiene'"-pattern-definition" \
            >"$blocked_message"
          if bash tools/check_repo_hygiene.sh \
            --commit-message-file "$blocked_message"; then
            printf '%s\n' "Blocked commit message was unexpectedly accepted." >&2
            exit 1
          fi

  regression-ubuntu:
    name: VHDL regression (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3 # v1.5.1
        with:
          version: 6.0.0
          backend: mcode

      - name: Run Bash regression
        shell: bash
        run: bash sim/run_ghdl.sh

  hygiene-windows:
    name: Repository hygiene (Windows)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run PowerShell content hygiene
        run: ./tools/check_repo_hygiene.ps1 -Mode Full

      - name: Run PowerShell tracked-path hygiene
        run: ./tools/check_repo_hygiene.ps1 -Mode Tracked

      - name: Run PowerShell history hygiene
        run: |
          ./tools/check_repo_hygiene.ps1 `
            -Mode History `
            -RevisionRange HEAD

      - name: Test PowerShell commit-message policy
        run: |
          $cleanMessage = Join-Path $env:RUNNER_TEMP "lm_i2c-clean.txt"
          $blockedMessage = Join-Path $env:RUNNER_TEMP "lm_i2c-blocked.txt"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $powerShellPath = (Get-Process -Id $PID).Path

          try {
            [IO.File]::WriteAllText(
              $cleanMessage,
              "ci: validate repository hygiene`n",
              $utf8NoBom
            )
            $cleanProcess = Start-Process `
              -FilePath $powerShellPath `
              -ArgumentList @(
                "-NoLogo",
                "-NoProfile",
                "-File",
                "./tools/check_repo_hygiene.ps1",
                "-Mode",
                "CommitMessage",
                "-CommitMessageFile",
                $cleanMessage
              ) `
              -NoNewWindow `
              -Wait `
              -PassThru
            $cleanExitCode = $cleanProcess.ExitCode
            if ($cleanExitCode -ne 0) {
              throw "Clean commit message was rejected."
            }

            [IO.File]::WriteAllText(
              $blockedMessage,
              (
                "Co-authored-by: Somebody x@y.z hygiene" +
                "-pattern-definition`n"
              ),
              $utf8NoBom
            )
            $blockedProcess = Start-Process `
              -FilePath $powerShellPath `
              -ArgumentList @(
                "-NoLogo",
                "-NoProfile",
                "-File",
                "./tools/check_repo_hygiene.ps1",
                "-Mode",
                "CommitMessage",
                "-CommitMessageFile",
                $blockedMessage
              ) `
              -NoNewWindow `
              -Wait `
              -PassThru
            $blockedExitCode = $blockedProcess.ExitCode
            if ($blockedExitCode -ne 1) {
              throw "Blocked commit message did not return exit code 1."
            }
          }
          finally {
            Remove-Item -LiteralPath $cleanMessage, $blockedMessage `
              -Force -ErrorAction SilentlyContinue
          }

  regression-windows:
    name: VHDL regression (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3 # v1.5.1
        with:
          version: 6.0.0
          backend: mcode

      - name: Run native PowerShell regression
        run: ./sim/run_ghdl.ps1
